<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <rect width="160" height="160" fill="#f8fafc"/>
  <line x1="10" y1="130" x2="150" y2="130" stroke="#cbd5e1" stroke-width="3"/>
  <!-- full bridge: shoulders to knees straight diagonal line -->
  <circle cx="25" cy="115" r="11" fill="#1f2937"/>
  <line x1="36" y1="115" x2="80" y2="92" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>
  <line x1="45" y1="112" x2="50" y2="124" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/>
  <line x1="80" y1="92" x2="103" y2="92" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>
  <line x1="103" y1="92" x2="110" y2="130" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>
  <!-- straight line guide -->
  <line x1="25" y1="115" x2="103" y2="92" stroke="#93c5fd" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="80" y="150" font-size="10" text-anchor="middle" fill="#64748b">肩膀到膝盖呈一条直线</text>
