<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <rect width="160" height="160" fill="#f8fafc"/>
  <line x1="10" y1="130" x2="150" y2="130" stroke="#cbd5e1" stroke-width="3"/>
  <!-- lying flat, knees bent, hips down -->
  <circle cx="25" cy="115" r="11" fill="#1f2937"/>
  <line x1="36" y1="115" x2="85" y2="115" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>
  <!-- arm resting on floor -->
  <line x1="45" y1="115" x2="50" y2="128" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/>
  <!-- bent leg: thigh up, shin down to foot on floor -->
  <line x1="85" y1="115" x2="105" y2="95" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>
  <line x1="105" y1="95" x2="110" y2="130" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>
  <text x="80" y="150" font-size="10" text-anchor="middle" fill="#64748b">躺下，屈膝，脚掌贴地</text>
</svg>
