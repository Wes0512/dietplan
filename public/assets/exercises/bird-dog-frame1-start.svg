<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <rect width="160" height="160" fill="#f8fafc"/>
  <line x1="10" y1="130" x2="150" y2="130" stroke="#cbd5e1" stroke-width="3"/>
  <!-- all-fours: head, flat back line, two arms down, two legs down -->
  <circle cx="115" cy="90" r="10" fill="#1f2937"/>
  <line x1="105" y1="93" x2="45" y2="93" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>
  <!-- front arm to floor -->
  <line x1="100" y1="93" x2="98" y2="128" stroke="#1f2937" stroke-width="6" stroke-linecap="round"/>
  <!-- back leg to floor -->
  <line x1="50" y1="93" x2="55" y2="128" stroke="#1f2937" stroke-width="6" stroke-linecap="round"/>
  <!-- second arm/leg slightly offset for depth -->
  <line x1="95" y1="93" x2="90" y2="128" stroke="#1f2937" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <line x1="55" y1="93" x2="62" y2="128" stroke="#1f2937" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <text x="80" y="150" font-size="10" text-anchor="middle" fill="#64748b">双手在肩膀正下方，膝盖在髋部正下方</text>
</svg>
