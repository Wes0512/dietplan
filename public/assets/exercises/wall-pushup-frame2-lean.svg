<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <rect width="160" height="160" fill="#f8fafc"/>
  <line x1="10" y1="145" x2="150" y2="145" stroke="#cbd5e1" stroke-width="3"/>
  <!-- wall -->
  <rect x="125" y="20" width="8" height="125" fill="#94a3b8"/>
  <!-- figure leaning in, elbows bent, closer to wall -->
  <circle cx="95" cy="45" r="12" fill="#1f2937"/>
  <line x1="95" y1="57" x2="102" y2="95" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>
  <!-- bent arms to wall -->
  <line x1="98" y1="63" x2="112" y2="55" stroke="#1f2937" stroke-width="6" stroke-linecap="round"/>
  <line x1="112" y1="55" x2="125" y2="60" stroke="#1f2937" stroke-width="6" stroke-linecap="round"/>
  <!-- legs -->
  <line x1="102" y1="95" x2="80" y2="140" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>
  <line x1="102" y1="95" x2="105" y2="140" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>
  <!-- inward motion arrow -->
  <path d="M60 70 Q75 68 90 65" stroke="#3b82f6" stroke-width="3" fill="none" marker-end="url(#arrow4)"/>
  <defs>
    <marker id="arrow4" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3b82f6"/>
    </marker>
  </defs>
  <text x="80" y="158" font-size="10" text-anchor="middle" fill="#64748b">手肘弯曲，身体靠近墙壁</text>
</svg>
