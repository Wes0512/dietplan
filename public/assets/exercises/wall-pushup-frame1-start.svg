<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <rect width="160" height="160" fill="#f8fafc"/>
  <line x1="10" y1="145" x2="150" y2="145" stroke="#cbd5e1" stroke-width="3"/>
  <!-- wall -->
  <rect x="125" y="20" width="8" height="125" fill="#94a3b8"/>
  <!-- figure standing at arm's length, body straight, hands on wall -->
  <circle cx="70" cy="45" r="12" fill="#1f2937"/>
  <line x1="70" y1="57" x2="90" y2="95" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>
  <!-- arms extended to wall -->
  <line x1="76" y1="65" x2="125" y2="60" stroke="#1f2937" stroke-width="6" stroke-linecap="round"/>
  <!-- legs angled back -->
  <line x1="90" y1="95" x2="70" y2="140" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>
  <line x1="90" y1="95" x2="95" y2="140" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>
  <text x="80" y="158" font-size="10" text-anchor="middle" fill="#64748b">双手撑墙，身体呈一条直线</text>
</svg>
