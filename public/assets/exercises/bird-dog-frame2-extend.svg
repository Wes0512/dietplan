<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <rect width="160" height="160" fill="#f8fafc"/>
  <line x1="10" y1="130" x2="150" y2="130" stroke="#cbd5e1" stroke-width="3"/>
  <!-- torso -->
  <circle cx="115" cy="90" r="10" fill="#1f2937"/>
  <line x1="105" y1="93" x2="45" y2="93" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>
  <!-- extending arm reaching forward (partway) -->
  <line x1="100" y1="93" x2="120" y2="80" stroke="#1f2937" stroke-width="6" stroke-linecap="round"/>
  <!-- extending opposite leg reaching back (partway) -->
  <line x1="50" y1="93" x2="30" y2="105" stroke="#1f2937" stroke-width="6" stroke-linecap="round"/>
  <!-- supporting arm/leg -->
  <line x1="95" y1="93" x2="90" y2="128" stroke="#1f2937" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <line x1="55" y1="93" x2="62" y2="128" stroke="#1f2937" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <!-- motion arrows -->
  <path d="M108 88 Q114 82 118 78" stroke="#3b82f6" stroke-width="2.5" fill="none" marker-end="url(#arrow6)"/>
  <path d="M45 96 Q38 100 32 104" stroke="#3b82f6" stroke-width="2.5" fill="none" marker-end="url(#arrow6)"/>
  <defs>
    <marker id="arrow6" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#3b82f6"/>
    </marker>
  </defs>
  <text x="80" y="150" font-size="10" text-anchor="middle" fill="#64748b">对侧手臂与腿同时伸出</text>
</svg>
