<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <rect width="160" height="160" fill="#f8fafc"/>
  <line x1="10" y1="145" x2="150" y2="145" stroke="#cbd5e1" stroke-width="3"/>
  <!-- wall -->
  <rect x="125" y="20" width="8" height="125" fill="#94a3b8"/>
  <!-- figure standing, one hand on wall, other leg bent behind holding foot -->
  <circle cx="75" cy="35" r="12" fill="#1f2937"/>
  <line x1="75" y1="47" x2="78" y2="95" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>
  <!-- arm to wall -->
  <line x1="80" y1="55" x2="125" y2="50" stroke="#1f2937" stroke-width="6" stroke-linecap="round"/>
  <!-- standing leg -->
  <line x1="78" y1="95" x2="72" y2="140" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>
  <!-- bent leg, foot pulled up behind toward hand -->
  <line x1="78" y1="95" x2="95" y2="110" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>
  <line x1="95" y1="110" x2="88" y2="85" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>
  <!-- other hand holding the foot -->
  <line x1="75" y1="60" x2="88" y2="82" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/>
  <text x="80" y="158" font-size="10" text-anchor="middle" fill="#64748b">保持 15-20 秒，换边</text>
</svg>
