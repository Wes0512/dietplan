<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <rect width="160" height="160" fill="#f8fafc"/>
  <line x1="20" y1="145" x2="140" y2="145" stroke="#cbd5e1" stroke-width="3"/>
  <!-- head tilted to the right -->
  <circle cx="92" cy="34" r="12" fill="#1f2937"/>
  <!-- torso -->
  <line x1="80" y1="46" x2="80" y2="95" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>
  <!-- neck line showing tilt -->
  <line x1="80" y1="46" x2="92" y2="34" stroke="#1f2937" stroke-width="6" stroke-linecap="round"/>
  <!-- arms relaxed at sides, one hand resting near ear -->
  <line x1="80" y1="55" x2="60" y2="90" stroke="#1f2937" stroke-width="6" stroke-linecap="round"/>
  <line x1="80" y1="55" x2="95" y2="45" stroke="#1f2937" stroke-width="6" stroke-linecap="round"/>
  <!-- legs -->
  <line x1="80" y1="95" x2="68" y2="140" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>
  <line x1="80" y1="95" x2="92" y2="140" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>
  <!-- gentle tilt arrow -->
  <path d="M100 30 Q108 34 106 42" stroke="#3b82f6" stroke-width="3" fill="none" marker-end="url(#arrow2)"/>
  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3b82f6"/>
    </marker>
  </defs>
  <text x="80" y="158" font-size="10" text-anchor="middle" fill="#64748b">缓慢地左右侧倾头部</text>
</svg>
