<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <rect width="160" height="160" fill="#f8fafc"/>
  <line x1="10" y1="130" x2="150" y2="130" stroke="#cbd5e1" stroke-width="3"/>
  <!-- hips lifting mid-way, straight-ish line torso to knee -->
  <circle cx="25" cy="115" r="11" fill="#1f2937"/>
  <line x1="36" y1="115" x2="82" y2="105" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>
  <line x1="45" y1="113" x2="50" y2="126" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/>
  <line x1="82" y1="105" x2="104" y2="95" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>
  <line x1="104" y1="95" x2="110" y2="130" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>
  <!-- upward motion arrow at hip -->
  <path d="M75 118 Q78 108 80 100" stroke="#3b82f6" stroke-width="3" fill="none" marker-end="url(#arrow5)"/>
  <defs>
    <marker id="arrow5" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3b82f6"/>
    </marker>
  </defs>
  <text x="80" y="150" font-size="10" text-anchor="middle" fill="#64748b">用脚发力，抬起臀部</text>
</svg>
