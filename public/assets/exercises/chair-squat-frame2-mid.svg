<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <rect width="160" height="160" fill="#f8fafc"/>
  <line x1="10" y1="145" x2="150" y2="145" stroke="#cbd5e1" stroke-width="3"/>
  <!-- chair -->
  <rect x="95" y="100" width="45" height="8" fill="#94a3b8"/>
  <rect x="130" y="100" width="8" height="45" fill="#94a3b8"/>
  <!-- mid-squat: hips back, torso leaning forward slightly, knees bent -->
  <circle cx="62" cy="50" r="12" fill="#1f2937"/>
  <line x1="62" y1="62" x2="78" y2="100" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>
  <line x1="66" y1="70" x2="45" y2="90" stroke="#1f2937" stroke-width="6" stroke-linecap="round"/>
  <line x1="66" y1="70" x2="88" y2="90" stroke="#1f2937" stroke-width="6" stroke-linecap="round"/>
  <!-- bent legs: thigh back to hip, shin forward to feet -->
  <line x1="78" y1="100" x2="55" y2="118" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>
  <line x1="55" y1="118" x2="65" y2="140" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>
  <line x1="78" y1="100" x2="95" y2="118" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>
  <line x1="95" y1="118" x2="88" y2="140" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>
  <!-- downward motion arrow -->
  <path d="M110 55 Q112 75 108 92" stroke="#3b82f6" stroke-width="3" fill="none" marker-end="url(#arrow3)"/>
  <defs>
    <marker id="arrow3" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3b82f6"/>
    </marker>
  </defs>
  <text x="80" y="158" font-size="10" text-anchor="middle" fill="#64748b">屁股向后向下坐</text>
</svg>
